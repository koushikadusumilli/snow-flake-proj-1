# =============================================================================
# Weather and flight ELT stack
#
# Services
#   airflow-db         Postgres 15, Airflow metadata only (never holds business data)
#   warehouse-db       Postgres 15, the analytics warehouse (raw / staging / marts)
#   airflow-init       One-shot job: migrates the metadata DB and creates the admin user
#   airflow-webserver  Airflow UI on http://localhost:8080
#   airflow-scheduler  Schedules and runs tasks (LocalExecutor, no Celery or Redis)
#
# Every credential has a default so `docker compose up --build -d` works on the
# first try. Override any of them by copying .env.example to .env.
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: weather-flight-airflow:local
  environment: &airflow-common-env
    # --- Airflow core -------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Unpaused at creation so the scheduler starts a first run on its own.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-local-dev-secret-key-change-me}"
    # Pick up DAG edits quickly while developing.
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"

    # --- Python import path --------------------------------------------------
    # Lets the DAG do `from src import extract` (./src is mounted below).
    PYTHONPATH: /opt/airflow

    # --- Warehouse connection ------------------------------------------------
    # Read by src/extract.py and by dbt_project/profiles.yml. Inside the Docker
    # network the warehouse is reachable as warehouse-db:5432.
    WAREHOUSE_HOST: warehouse-db
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: "${WAREHOUSE_DB:-warehouse}"
    WAREHOUSE_USER: "${WAREHOUSE_USER:-warehouse}"
    WAREHOUSE_PASSWORD: "${WAREHOUSE_PASSWORD:-warehouse}"

    # --- dbt -----------------------------------------------------------------
    # The project is mounted read-only, so dbt writes its artifacts to /tmp.
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    DBT_TARGET_PATH: /tmp/dbt_target
    DBT_LOG_PATH: /tmp/dbt_logs
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./dbt_project:/opt/airflow/dbt_project:ro
    # Named volume avoids host file-permission problems on Linux.
    - airflow-logs:/opt/airflow/logs

services:
  # ---------------------------------------------------------------------------
  # Airflow metadata database
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Data warehouse (raw -> staging -> marts)
  # Scripts in ./warehouse/init run once, on the first start of an empty volume.
  # ---------------------------------------------------------------------------
  warehouse-db:
    image: postgres:15
    environment:
      POSTGRES_USER: "${WAREHOUSE_USER:-warehouse}"
      POSTGRES_PASSWORD: "${WAREHOUSE_PASSWORD:-warehouse}"
      POSTGRES_DB: "${WAREHOUSE_DB:-warehouse}"
    ports:
      # Host port 5433 avoids clashing with a local Postgres on 5432.
      - "${WAREHOUSE_HOST_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot initialisation. The official Airflow entrypoint reads the
  # _AIRFLOW_* variables below, migrates the DB and creates the admin user.
  # Safe to run repeatedly.
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs:
  warehouse-data:
